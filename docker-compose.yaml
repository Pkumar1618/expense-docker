version: "3"
networks: 
  expense:
volumes:
  mysql:   # docker volume create mysql
services:
  mysql:
    image: kumarprashanth/mysql:latest
    conatiner_name: mysql # --name mysql
    volumes:
    - mysql:/var/lib/mysql # -v mysql:/var/lib/mysql
  backend:
    image: kumarprashanth/backend:latest
    conatainer_name: backend
    depends_on:
    - mysql
  frontend:
    image: kumarprashanth/frontend:latest
    container_name: frontend
    ports:
    - 80:80
    depends_on:
    - backend