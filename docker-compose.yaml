version: "3"

networks:
  expense:

volumes:
  mysql:

services:
  mysql:
    image: kumarprashanth/mysql:latest
    container_name: mysql
    networks:
      - expense
    volumes:
      - mysql:/var/lib/mysql

  backend:
    image: kumarprashanth/backend:latest
    container_name: backend
    command: sh -c "sleep 5 && node /opt/server/index.js"
    networks:
      - expense
    depends_on:
      - mysql

  frontend:
    image: kumarprashanth/frontend:latest
    container_name: frontend
    networks:
      - expense
    ports:
      - "80:80"
    depends_on:
      - backend